name: Daily Nepal Morning Brief

on:
  workflow_dispatch:
  schedule:
    # Nepal Time is UTC+05:45. GitHub cron is always UTC.
    # 45 23 * * * = 05:30 NPT the following day (primary run, early on purpose).
    # 15 00 * * * = 06:00 NPT the same UTC day (backup run).
    # The off-the-hour minutes avoid the busiest cron slot. Scheduled runs are
    # best-effort: GitHub can delay them, and occasionally drops them entirely.
    # The state file prevents the backup run from sending a duplicate.
    - cron: "45 23 * * *"
    - cron: "15 0 * * *"

permissions:
  contents: write

concurrency:
  group: nepal-morning-brief-daily
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and send digest
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python -m nmb.main

      - name: Commit idempotency state
        if: success()
        run: |
          if git diff --quiet -- state/last_sent.json; then
            echo "State unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last_sent.json
          git commit -m "chore: record sent digest"
          git push

      - name: Write failure summary
        if: failure()
        run: |
          echo "::error title=Nepal Morning Brief failed::The digest run failed. See the redacted logs above."
          {
            echo "## Nepal Morning Brief failed"
            echo ""
            echo "The workflow failed visibly. Check the redacted job logs above."
            echo "If the digest was not sent, the state file was not updated."
            echo "If the digest was sent, check whether the state commit succeeded before retrying."
          } >> "$GITHUB_STEP_SUMMARY"
