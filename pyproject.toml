[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nepal-morning-brief"
version = "1.0.0"
description = "Serverless daily Nepal news digest delivered by Gmail"
requires-python = ">=3.12"
dependencies = [
  "feedparser==6.0.11",
  "Jinja2==3.1.6",
  "pydantic==2.11.7",
  "python-dateutil==2.9.0.post0",
  "PyYAML==6.0.2",
  "rapidfuzz==3.13.0",
  "requests==2.32.4",
  "tzdata==2025.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nmb = ["render/templates/*.j2"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
